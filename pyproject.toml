[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhotspot"
version = "2.8.0"
description = "Cross-platform Wi-Fi hotspot manager with Windows/Linux backends, CLI and PyQt5 HUD GUI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CyberHotspot contributors"}]
dependencies = [
  "PyQt5>=5.15",
  "psutil>=5.9",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
windows = ["winrt-runtime==3.2.1", "winrt-Windows.Foundation==3.2.1", "winrt-Windows.Networking.Connectivity==3.2.1", "winrt-Windows.Networking.NetworkOperators==3.2.1"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]

[project.scripts]
cyberhotspot = "cyberhotspot.cli:main"
cyberhotspot-gui = "cyberhotspot.gui:main"

[tool.setuptools.packages.find]
include = ["cyberhotspot*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cyberhotspot = ["assets/*.ps1"]
