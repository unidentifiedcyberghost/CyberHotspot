name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cython pyinstaller pyarmor
      - name: Build Cython modules
        run: python3 setup_cython.py build_ext --inplace || true
      - name: Build PyInstaller binary
        run: pyinstaller --onefile --name CyberHotspot_bin cyberhotspot/cli.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberHotspot-bin
          path: dist/CyberHotspot_bin